{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Idioma por defecto: español. El visitante lo cambia con el botón del menú. -->
<script>
  (function () {
    var lang = 'es';
    try { lang = localStorage.getItem('lang') || 'es'; } catch (e) {}
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.lang = lang;
  })();
</script>
<style>
  html[data-lang="es"] .lang-en { display: none !important; }
  html[data-lang="en"] .lang-es { display: none !important; }
</style>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
